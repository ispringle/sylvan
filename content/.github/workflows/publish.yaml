# Legacy dual-repo deploy path; primary workflow is sylvan/.github/workflows/deploy.yaml
name: GitHub Actions Production Deployment

on:
  push:
    branches:
      - master
  repository_dispatch:
    types:
      - sylvan-update
  workflow_dispatch:

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sylvan
        uses: actions/checkout@v4
        with:
          repository: ispringle/sylvan

      - name: Checkout Org content
        uses: actions/checkout@v4
        with:
          path: content/

      - name: "Remove files marked :PRIVATE: t"
        run: 'find ./content -type f -exec grep -q "^:PRIVATE: t\$" {} \; -delete'

      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages publish --project-name=org dist
